apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: anps-allow-access-from-ingress
  labels:
    component: demis
spec:
  selector:
    matchLabels:
      app: are-notification-processing-service
  action: ALLOW
  rules:
    - from:
      - source:
          principals: 
            - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
      to:
        - operation:
            methods: [ "POST" ]
            paths:
              - "/$process-are-notification"
              - "/%24process-are-notification"